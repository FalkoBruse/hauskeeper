<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#F4F6FB" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0E121A" media="(prefers-color-scheme: dark)">
  <title>Einladung zu Hauskeeper</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22.4' fill='%232451B8'/%3E%3Cpath d='M21 45 L50 22 L79 45' fill='none' stroke='%23fff' stroke-width='7.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3Crect x='30' y='46' width='10' height='34' rx='3' fill='%23fff'/%3E%3Crect x='60' y='46' width='10' height='34' rx='3' fill='%23fff'/%3E%3Crect x='38' y='58' width='24' height='8' rx='2' fill='%237AA2FF'/%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #F4F6FB; --surface: #FFFFFF; --text: #121826; --text-2: #5B6475;
      --accent: #2451B8; --accent-text: #FFFFFF; --accent-soft: #E6EDFB; --rand: #E3E7EF;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0E121A; --surface: #171C26; --text: #EEF1F7; --text-2: #9AA3B5;
        --accent: #7AA2FF; --accent-text: #0E121A; --accent-soft: #1E2A44; --rand: #252C3A;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif;
      display: flex; justify-content: center;
      padding: max(48px, env(safe-area-inset-top)) 20px max(32px, env(safe-area-inset-bottom));
    }
    main { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 22px; }
    .logo { width: 72px; height: 72px; border-radius: 20px; display: block; }
    h1 { margin: 6px 0 0; font-size: 28px; line-height: 1.2; letter-spacing: -0.02em; }
    p { margin: 0; color: var(--text-2); font-size: 16px; line-height: 1.5; }
    .btn {
      display: block; width: 100%; text-align: center; text-decoration: none; border: 0; cursor: pointer;
      font: inherit; font-weight: 600; font-size: 17px; padding: 16px; border-radius: 16px;
      background: var(--accent); color: var(--accent-text);
    }
    .btn.zweit { background: var(--accent-soft); color: var(--text); font-size: 15px; padding: 12px; }
    .karte { background: var(--surface); border: 1px solid var(--rand); border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
    .karte h2 { margin: 0; font-size: 15px; font-weight: 600; }
    .code {
      font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 30px; font-weight: 600;
      letter-spacing: 0.14em; text-align: center; padding: 10px; border-radius: 12px; background: var(--bg);
      user-select: all; -webkit-user-select: all;
    }
    ol { margin: 0; padding-left: 20px; color: var(--text-2); line-height: 1.6; font-size: 15px; }
    .versteckt { display: none; }
  </style>
</head>
<body>
  <main>
    <svg class="logo" viewBox="0 0 100 100" aria-hidden="true">
      <rect width="100" height="100" rx="22.4" fill="#2451B8"/>
      <path d="M21 45 L50 22 L79 45" fill="none" stroke="#FFFFFF" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="30" y="46" width="10" height="34" rx="3" fill="#FFFFFF"/>
      <rect x="60" y="46" width="10" height="34" rx="3" fill="#FFFFFF"/>
      <rect x="38" y="58" width="24" height="8" rx="2" fill="#7AA2FF"/>
    </svg>

    <div>
      <h1 id="titel">Einladung zu Hauskeeper</h1>
      <p id="text" style="margin-top:10px">Du wurdest in einen Haushalt eingeladen. Hauskeeper öffnet sich gleich mit deiner Einladung.</p>
    </div>

    <a id="oeffnen" class="btn" href="#">In Hauskeeper öffnen</a>

    <div id="karte" class="karte">
      <h2>Hat sich die App nicht geöffnet?</h2>
      <ol>
        <li>Hauskeeper öffnen</li>
        <li>„Ich habe eine Einladung“ wählen</li>
        <li>Diesen Code eingeben oder einfügen:</li>
      </ol>
      <div id="code" class="code">––––-––––</div>
      <button id="kopieren" class="btn zweit" type="button">Code kopieren</button>
    </div>
  </main>

  <script>
    (function () {
      var treffer = /[?&]code=([^&#]+)/i.exec(location.search);
      var roh = treffer ? decodeURIComponent(treffer[1]) : '';
      var sauber = roh.toUpperCase().replace(/[^A-Z0-9]/g, '');
      var oeffnen = document.getElementById('oeffnen');

      if (sauber.length !== 8) {
        document.getElementById('titel').textContent = 'Kein gültiger Einladungslink';
        document.getElementById('text').textContent = 'In diesem Link fehlt der Einladungscode. Bitte lass dir eine neue Einladung schicken.';
        oeffnen.classList.add('versteckt');
        document.getElementById('karte').classList.add('versteckt');
        return;
      }

      var code = sauber.slice(0, 4) + '-' + sauber.slice(4);
      var appLink = 'hauskeeper://einladung?code=' + encodeURIComponent(code);
      document.getElementById('code').textContent = code;
      oeffnen.href = appLink;

      document.getElementById('kopieren').addEventListener('click', function () {
        var knopf = this;
        navigator.clipboard.writeText(code).then(function () {
          knopf.textContent = 'Kopiert';
          setTimeout(function () { knopf.textContent = 'Code kopieren'; }, 2000);
        });
      });

      // Gleich versuchen, die App zu öffnen (Safari fragt: „In Hauskeeper öffnen?“)
      setTimeout(function () { location.href = appLink; }, 400);
    })();
  </script>
</body>
</html>
